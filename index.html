<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#7716b6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Adivinueve">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Adivinueve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Roboto:wght@400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
/* 1rem = 10 px de la maquette d'origine (924 px de large) -> tout se redimensionne à l'identique */
:root{
  --purple:#ac54ec; --lilac:#cb99e9; --strip:#c396e9; --line:#ac53ec; --field:#cc94f4;
  --orange:#fbb040; --teal:#14d4c4; --pink:#f42464; --blue:#54b4fc;
  --team:#fbb040;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(min(100vw, 520px) / 92.4);background:#8b2fc6}
body{margin:0;min-height:100dvh;font-family:'Roboto',system-ui,sans-serif;font-weight:700;color:#fff;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#7716b6 0%,#b76aec 60%,#8b2fc6 100%)}
button{font-family:inherit;border:0;cursor:pointer;padding:0;color:inherit;background:none}
input,textarea,select{font-family:inherit;-webkit-user-select:text;user-select:text}
h1,h2,h3,p{margin:0}
#app{width:92.4rem;margin:0 auto;min-height:100dvh;position:relative}
.screen{min-height:100dvh;position:relative;display:flex;flex-direction:column;padding-bottom:max(4rem,env(safe-area-inset-bottom))}
.q{font-family:'Quicksand',sans-serif}
svg{display:block}

/* ---------- boutons 3D ---------- */
.pbtn{display:flex;align-items:center;justify-content:center;gap:3.4rem;width:60.5rem;height:13.8rem;margin:0 auto;border-radius:7rem;
  font:700 6.3rem/1 'Quicksand',sans-serif;color:#fff;letter-spacing:.1rem;position:relative;
  background:linear-gradient(180deg,#ee2c70 0%,#d9255f 55%,#c41f56 100%);
  box-shadow:inset 0 .5rem .2rem rgba(255,255,255,.55),inset 0 -.7rem .4rem rgba(0,0,0,.08),0 1.1rem 0 #82314a;
  transition:transform .08s,box-shadow .08s}
.pbtn.teal{background:linear-gradient(180deg,#63ece0 0%,#3fd4c5 55%,#1fb9a9 100%);box-shadow:inset 0 .5rem .2rem rgba(255,255,255,.6),0 1.1rem 0 #357b6f}
.pbtn.yellow{background:linear-gradient(180deg,#ffd978 0%,#ffcb3f 50%,#f5b21f 100%);box-shadow:inset 0 .5rem .2rem rgba(255,255,255,.65),0 1.1rem 0 #a18234}
.pbtn:active{transform:translateY(.9rem);box-shadow:inset 0 .5rem .2rem rgba(255,255,255,.4),0 .2rem 0 #6a2a3d}
.pbtn svg{width:5.8rem;height:5.8rem}
.fab{display:flex;align-items:center;justify-content:center;width:21.6rem;height:10.2rem;border-radius:5.1rem;align-self:flex-end;margin:3.4rem 3.6rem 0 0;
  background:linear-gradient(180deg,#68efe3 0%,#3fd4c5 50%,#17b3a3 100%);border:.45rem solid #1fa497;
  box-shadow:inset 0 .4rem .2rem rgba(255,255,255,.55),0 .8rem 0 rgba(0,0,0,.16)}
.fab:active{transform:translateY(.6rem)}
.fab svg{width:7rem;height:6rem}
.fab.text{font:700 5rem/1 'Quicksand',sans-serif;color:#fff;width:34.8rem;gap:1.4rem}
.fab[disabled]{opacity:.45;pointer-events:none}
.fab.pink{background:linear-gradient(180deg,#ff5d90 0%,#f42464 55%,#d11a55 100%);border-color:#b21648}
.fab.ghost{background:linear-gradient(180deg,#d9b2f4 0%,#c396e9 100%);border-color:#a96ed6}
.circ{width:7.5rem;height:7.5rem;border-radius:50%;display:grid;place-items:center;flex:none;
  background:linear-gradient(160deg,#d89bfb 0%,#a64be8 100%);box-shadow:inset 0 .3rem .2rem rgba(255,255,255,.45),0 .4rem 0 rgba(80,10,130,.28)}
.circ svg{width:4.2rem;height:4.2rem}
.circ.sm{width:7.1rem;height:7.1rem}

/* ---------- en-tête blanc + bande lilas ---------- */
.hdr{position:relative;background:#fff;height:max(34.3rem,calc(env(safe-area-inset-top) + 24rem));display:flex;align-items:flex-end;gap:2.4rem;
  padding:0 4.3rem 8rem;flex:none}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:-3.2rem;height:3.2rem;background:var(--lilac)}
.hdr h1{font:700 5.7rem/1 'Quicksand',sans-serif;color:var(--purple);text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:.4rem}
.hdr.center h1{text-align:center}
.hdr .circ{margin-bottom:.1rem}
.body{padding:8.7rem 0 0;display:flex;flex-direction:column;flex:1}
.body.low{padding-top:13rem}

/* ---------- cartes blanches ---------- */
.card{background:#fff;color:#000;border-radius:4.2rem;margin:0 3.5rem;box-shadow:0 1.2rem 0 var(--strip);position:relative}
.card+.card{margin-top:5.4rem}
.row{display:flex;align-items:center;gap:2rem;min-height:16.6rem;padding:0 3rem;border-top:.4rem solid var(--line);text-transform:uppercase;font-size:3.6rem;line-height:1.15}
.row:first-child{border-top:0}
.row .lbl{flex:1;display:flex;align-items:center;gap:1.6rem}
.row .lbl small{display:block;font-size:2.4rem;color:#8a5bb0;font-weight:500;text-transform:none;margin-top:.5rem}
.info{text-transform:none;width:4.2rem;height:4.2rem;border-radius:50%;background:var(--field);color:#fff;font:700 2.8rem/4.2rem 'Quicksand',sans-serif;text-align:center;align-self:flex-start;margin-top:3.2rem}
.step{display:flex;align-items:center;gap:2.4rem}
.step .b{width:5.2rem;height:5.2rem;border-radius:50%;border:.4rem solid #8f8f8f;display:grid;place-items:center;color:#8f8f8f}
.step .b.plus{border-color:#000;color:#000}
.step .b svg{width:3rem;height:3rem}
.step .v{width:10.6rem;height:10.6rem;border-radius:2rem;display:grid;place-items:center;color:#fff;font:700 5.6rem/1 'Quicksand',sans-serif;box-shadow:0 .8rem 0 rgba(0,0,0,.14)}
.sq{width:10.6rem;height:10.6rem;border-radius:2rem;display:grid;place-items:center;background:linear-gradient(180deg,#58e3d6,#1fc3b2);box-shadow:0 .8rem 0 #1b968a}
.sq svg{width:6.2rem;height:6.2rem}
.sw{width:13.4rem;height:6.4rem;border-radius:3.2rem;background:var(--field);position:relative;flex:none;box-shadow:inset 0 .3rem .4rem rgba(0,0,0,.12);transition:background .15s}
.sw::after{content:"";position:absolute;top:.7rem;left:.7rem;width:5rem;height:5rem;border-radius:50%;background:#fff;box-shadow:0 .2rem .5rem rgba(0,0,0,.28);transition:transform .15s}
.sw.on{background:#3cd4c4}
.sw.on::after{transform:translateX(7rem)}
.row.theme{min-height:12.9rem;font-size:3.5rem}
.row.theme .em{font-size:5rem;width:6.4rem;text-align:center;line-height:1}

/* ---------- accueil ---------- */
.home{background:none}
.hero{position:relative;background:#fff;height:104rem;border-radius:0 0 50% 50% / 0 0 17rem 17rem;box-shadow:0 3.6rem 0 var(--lilac),0 3.6rem 0 0 var(--lilac);z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6.5rem}
.hero .logo{margin-bottom:6rem;display:flex;flex-direction:column;align-items:center;gap:.8rem}
.hero .go{font:700 6.6rem/1 'Quicksand',sans-serif;color:var(--pink);letter-spacing:.2rem}
.rays{position:absolute;left:0;right:0;top:80rem;bottom:0;z-index:0;
  background:repeating-conic-gradient(from 0deg at 50% 38%,rgba(255,255,255,.0) 0deg 4deg,rgba(255,255,255,.1) 4deg 8deg);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 38%,#000 20%,transparent 85%);mask-image:radial-gradient(ellipse 90% 70% at 50% 38%,#000 20%,transparent 85%)}
.menu{position:relative;z-index:1;display:flex;flex-direction:column;gap:5.6rem;margin-top:10rem}
.ver{position:relative;z-index:1;text-align:center;color:rgba(255,255,255,.7);font:500 2.6rem 'Quicksand',sans-serif;margin-top:auto;padding-top:6rem}

/* ---------- barre équipe (jeu) ---------- */
.topbar{position:relative;height:7rem;margin-top:max(14.6rem,calc(env(safe-area-inset-top) + 1.4rem));display:grid;place-items:center;flex:none}
.pill{width:55.7rem;height:7rem;border-radius:1.8rem;background:var(--team);border-bottom:.6rem solid rgba(255,255,255,.85);color:#fff;
  font:700 4.6rem/6.4rem 'Quicksand',sans-serif;text-align:center;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2rem;
  text-shadow:0 .2rem 0 rgba(0,0,0,.08)}
.topbar .l{position:absolute;left:3.5rem;top:-.2rem}
.topbar .r{position:absolute;right:3.5rem;top:-.2rem}

/* ---------- partie : question + chrono + réponses ---------- */
.board{margin:3.6rem 3.5rem 0;background:#fff;color:#000;border-radius:4.2rem;box-shadow:0 1.2rem 0 #c076ef;overflow:hidden}
.qhead{height:39.6rem;display:flex;flex-direction:column}
.qtext{flex:1;display:grid;place-items:center;padding:4.5rem 3rem 0;text-align:center;font:700 3.6rem/1.28 'Roboto',sans-serif;text-transform:uppercase}
.timer{height:6rem;margin:0 2.4rem 2.1rem 2.5rem;display:flex;align-items:center;gap:2rem}
.lcd{width:4.8rem;height:3.5rem;flex:none}
.bar{flex:1;height:3.2rem;border-radius:1.6rem;background:#e8e6e8;overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:1.6rem;background:var(--team);box-shadow:inset 0 .6rem 0 rgba(255,255,255,.3);transition:width .22s linear}
.bar.low i{background:var(--pink)}
.rows{height:104rem;display:flex;flex-direction:column}
.ans{flex:1;display:flex;align-items:center;gap:2rem;padding:0 3.6rem 0 3rem;border-top:.45rem solid var(--line);text-align:left;color:#000;
  font:700 3.2rem/1.1 'Roboto',sans-serif;text-transform:uppercase;width:100%;min-height:0}
.ans .t{flex:1}
.ans .p{font-size:3.4rem}
.ans svg{width:4.4rem;height:4.4rem;flex:none}
.ans.trap{padding-left:3.5rem}
.ans.on{background:var(--team);color:#fff}
.ans.hit{background:var(--pink);color:#fff;animation:shake .35s}
.ans:active{filter:brightness(.97)}

/* ---------- intro de manche ---------- */
.intro{margin:3.6rem 3.9rem 0;height:97.6rem;background:#fff;color:#000;border-radius:4.2rem;box-shadow:0 1.2rem 0 #c396e9;display:flex;flex-direction:column;align-items:center}
.intro .rnd{height:14.6rem;display:flex;align-items:center;justify-content:center;gap:2rem;font:700 4.2rem/1 'Quicksand',sans-serif;color:var(--purple);text-transform:uppercase}
.intro .rnd i{font-style:normal;font-size:5.6rem}
.intro .qtext{flex:none;height:31.8rem;padding:0 4rem;font-size:3.6rem}
.intro .go{height:24rem;display:grid;place-items:center;font:700 8.6rem/1 'Quicksand',sans-serif;color:var(--purple)}
.intro .pbtn{margin:4.2rem 0 0;width:57.5rem;height:14.2rem}
.slot{height:26.3rem;display:flex;align-items:center;justify-content:center;gap:4rem;padding:0 3.9rem}
.jk{width:17.4rem;height:20rem;border-radius:3.2rem;background:#fff;color:#000;box-shadow:0 1rem 0 var(--strip);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;text-align:center}
.jk b{font:700 7.4rem/1 'Quicksand',sans-serif;color:var(--purple)}
.jk small{font:500 2.5rem/1.15 'Roboto',sans-serif;color:#555;padding:0 1rem}
.jk.on{background:var(--orange);box-shadow:0 1rem 0 #c47d0c}
.jk.on b,.jk.on small{color:#fff}
.jk[disabled]{opacity:.4;pointer-events:none}
.jk.on[disabled]{opacity:1}
.hold{margin:0 3.9rem;height:23rem;background:#fff;color:#000;border-radius:3.6rem;box-shadow:0 1rem 0 #cf8efd;display:flex;align-items:center;gap:3.4rem;padding:0 3.4rem 0 1.6rem}
.hold .ph{width:17rem;height:17rem;flex:none}
.hold p{font:700 3.4rem/1.6 'Roboto',sans-serif;text-transform:uppercase}

/* ---------- scores ---------- */
.rtitle{display:flex;justify-content:space-between;align-items:center;padding:9.9rem 3.5rem 0;font:700 5rem/1 'Quicksand',sans-serif;text-transform:uppercase;height:21.2rem}
.trophy{display:inline-block;animation:trophy 1.1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes trophy{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.rtitle .d{color:#fff}
.sc{margin:0 3.3rem;background:#fff;color:#000;border-radius:4.2rem;box-shadow:0 1.2rem 0 #c396e9;height:19.5rem;padding:3rem 3.2rem 0}
.sc+.sc{margin-top:5.8rem}
.sc .n{font:700 3.8rem/1 'Roboto',sans-serif;text-transform:uppercase;height:4.4rem}
.sc .l{display:flex;align-items:center;gap:2rem;margin-top:1.6rem}
.sc .tr{flex:1;height:5.5rem}
.sc .tr i{display:block;height:100%;min-width:1.8rem;border-radius:2.8rem;background:var(--c);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.sc .v{font:700 3.8rem/1 'Roboto',sans-serif;width:15rem;text-align:right;text-transform:uppercase}
.revpts{margin:4rem 3.5rem 0;text-align:center;font:700 5.4rem/1 'Quicksand',sans-serif;color:#fff;text-transform:uppercase}
.note{margin:4.6rem 3.5rem 0;text-align:center;font:500 3.2rem/1.3 'Quicksand',sans-serif;color:#fff}
.missed{margin:4rem 3.5rem 0;background:rgba(40,0,80,.22);border-radius:3rem;padding:3rem 3.4rem;font:500 3.2rem/1.3 'Roboto',sans-serif;color:#fff}
.missed summary{font-weight:700;cursor:pointer}
.missed ul{margin:2rem 0 0;padding-left:3.6rem;display:grid;gap:.8rem}
.missed li span{opacity:.7}

/* ---------- équipes ---------- */
.tcard{padding:0 0 5.2rem;margin-top:0}
.tcard .cnt{height:11.4rem;padding-right:4.4rem;text-align:right;font:700 5.2rem/11.4rem 'Quicksand',sans-serif;color:var(--purple)}
.tcard .lab{height:6.4rem;margin:5.4rem 0 0;text-align:center;font:700 3.2rem/6.4rem 'Roboto',sans-serif;text-transform:uppercase}
.tcard .lab.l2{margin-top:7.6rem}
.cols{display:flex;justify-content:space-between;padding:0 10.6rem;margin:7.1rem 0 0}
.col{width:10.7rem;height:10.7rem;border-radius:50%;border:.7rem solid transparent;background-clip:padding-box;position:relative}
.col.sel{box-shadow:0 0 0 .6rem #fff,0 0 0 1.2rem var(--purple)}
.col.taken{opacity:.35;pointer-events:none}
.tin{width:calc(100% - 14.8rem);height:13.5rem;border-radius:4rem;border:.4rem solid var(--purple);background:var(--field);color:#fff;font:700 5rem/1 'Quicksand',sans-serif;padding:0 4rem;margin:7.7rem 7.4rem 0;outline:none;text-transform:uppercase}
.tin::placeholder{color:rgba(255,255,255,.7)}
.tin:focus{background:#d5a6f6}
.tbtns{display:flex;justify-content:space-between;align-items:center;margin-top:11.1rem;padding:0 7.7rem 0 7.4rem}
.tbtn{height:10.2rem;border-radius:5.1rem;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#68efe3,#2fc9b9 55%,#17a99a);font:700 5.4rem/1 'Quicksand',sans-serif;color:#fff;padding:0 5rem;box-shadow:inset 0 .4rem .2rem rgba(255,255,255,.55),0 .8rem 0 #14877c}
.tbtn.sm{width:14.6rem;padding:0}
.tbtn svg{width:5.6rem;height:5.6rem}

/* ---------- VS ---------- */
.vs{position:fixed;inset:0;z-index:50;background:#fff}
.vs .band{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:700 6.6rem/1.1 'Quicksand',sans-serif;text-align:center;text-transform:uppercase;padding:0 6rem;text-shadow:0 .3rem 0 rgba(0,0,0,.1)}
.vs .badge{position:absolute;left:50%;width:16.6rem;height:16.6rem;border-radius:50%;background:#fff;color:var(--purple);display:grid;place-items:center;font:400 10.4rem/1 'Bebas Neue',sans-serif;transform:translate(-50%,-50%)}

/* ---------- règles (carrousel) ---------- */
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;flex:1}
.slides::-webkit-scrollbar{display:none}
.slide{flex:none;width:92.4rem;scroll-snap-align:center;padding:3.2rem 4rem 0;display:flex;flex-direction:column;gap:5rem}
.slide .card{margin:0;padding:4.4rem 4.2rem;font:400 4.4rem/1.5 'Roboto',sans-serif;text-align:center}
.slide .card b{color:var(--purple);font-weight:700}
.slide .big{font:700 11rem/1 'Quicksand',sans-serif;color:var(--teal)}
.slide .txt{color:#fff;font:400 5.6rem/1.3 'Roboto',sans-serif;text-align:center}
.slide .txt b{color:var(--teal);font:700 11rem/1 'Quicksand',sans-serif;display:block}
.slide .ill{width:100%}
.dots{display:flex;justify-content:center;gap:3.4rem;padding:3rem 0 6rem}
.dots i{width:1.9rem;height:1.9rem;border-radius:50%;background:rgba(255,255,255,.4)}
.dots i.on{background:#fff}
.bar2{height:3.4rem;border-radius:1.7rem;background:#e8e6e8;margin-top:3rem;overflow:hidden}
.bar2 i{display:block;height:100%;width:42%;background:var(--purple);border-radius:1.7rem}
.bombs{display:flex;justify-content:center;align-items:flex-end;gap:9rem}
.exa{border-radius:0;padding:0;display:flex;flex-direction:column;overflow:hidden;border-radius:2rem}
.exa .p{height:40rem;position:relative;display:flex;align-items:center;gap:3rem;padding:0 4rem;font:500 4.6rem/1.2 'Roboto',sans-serif;color:#000}
.exa .p .nb{position:absolute;top:2rem;width:11rem;height:9rem;border-radius:3rem;background:#fff;color:var(--purple);font:700 6rem/9rem 'Quicksand',sans-serif;text-align:center}
.exa .p .bub{background:#fff;border-radius:3rem;padding:3rem;width:45%;margin-top:7rem;text-align:center}
.exa .p .face{font-size:20rem;line-height:1;margin-left:auto}
.exa .p.t{background:#4cd4cc}.exa .p.o{background:#fcb444}

/* ---------- éditeur ---------- */
.search{width:100%;height:11rem;border-radius:5.5rem;border:.4rem solid var(--purple);background:var(--field);color:#fff;font:700 4rem/1 'Roboto',sans-serif;padding:0 4rem;outline:none}
.search::placeholder{color:rgba(255,255,255,.75)}
.chips{display:flex;gap:2rem;overflow-x:auto;padding:3rem 0 .5rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:8.6rem;border-radius:4.3rem;padding:0 3.4rem;font:700 3.4rem/8.2rem 'Roboto',sans-serif;border:.4rem solid var(--line);color:var(--purple);background:#fff;white-space:nowrap}
.chip.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.qrow{display:flex;align-items:center;gap:3rem;padding:3.4rem 3rem;border-top:.4rem solid var(--line);text-align:left;width:100%;color:#000}
.qrow:first-child{border-top:0}
.qrow .em{font-size:5.4rem;line-height:1;width:7rem;text-align:center;flex:none}
.qrow .qt{flex:1;min-width:0;font:700 3.5rem/1.2 'Roboto',sans-serif;text-transform:uppercase}
.qrow .qq{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qrow .qm{font:500 2.7rem/1.3 'Roboto',sans-serif;color:#8a5bb0;text-transform:none;display:block;margin-top:.6rem}
.qrow .go2{color:var(--purple);flex:none}
.qrow .go2 svg{width:4rem;height:4rem}
.empty{padding:8rem 4rem;text-align:center;font:500 3.8rem/1.4 'Roboto',sans-serif;color:#7a5a95}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:3rem;margin:5rem 3.5rem 0}
.tool{height:11.6rem;border-radius:5.8rem;background:rgba(255,255,255,.16);border:.4rem solid rgba(255,255,255,.55);color:#fff;font:700 3.4rem/1.1 'Quicksand',sans-serif}
.tool.full{grid-column:1/3}
.tool.danger{background:rgba(244,36,100,.25);border-color:rgba(255,255,255,.4)}
.fld{padding:4rem 4rem 0;text-transform:none}
.fld:last-child{padding-bottom:4.4rem}
.fld .lab{font:700 2.9rem/1 'Roboto',sans-serif;text-transform:uppercase;color:var(--purple);letter-spacing:.1rem;margin-bottom:1.8rem}
.inp{width:100%;border:.4rem solid var(--line);border-radius:2.4rem;background:#faf5ff;color:#000;font:500 3.8rem/1.25 'Roboto',sans-serif;padding:2.4rem 3rem;outline:none}
.inp:focus{border-color:var(--purple);background:#fff}
textarea.inp{resize:none;min-height:18rem}
select.inp{appearance:none;font-weight:700}
.arow{display:flex;align-items:center;gap:1.8rem;margin-bottom:2rem}
.arow .inp{padding:2.2rem 2.4rem}
.arow .pts{width:13rem;flex:none;text-align:center;font-weight:700;padding:2.2rem 0}
.arow .x{width:8rem;height:8rem;border-radius:50%;background:#fde7ef;color:var(--pink);font:700 4.4rem/8rem sans-serif;text-align:center;flex:none}
.quick{display:flex;gap:1.4rem;margin:-.6rem 0 2.6rem}
.quick button{width:8.6rem;height:6.4rem;border-radius:2rem;background:#efe3fb;color:var(--purple);font:700 3.2rem/6.4rem 'Quicksand',sans-serif}
.add{width:100%;height:10.6rem;border-radius:5.3rem;border:.5rem dashed var(--purple);color:var(--purple);font:700 3.6rem/1 'Quicksand',sans-serif;margin-top:1rem}
.trapbox{background:#fff1f5;border-radius:3rem;padding:3.2rem;margin:0 4rem 4.4rem;border:.4rem solid #ffd0de}
.trapbox .lab{color:var(--pink)}
.savebar{display:flex;gap:3rem;margin:5rem 3.5rem 0}
.savebar .pbtn{width:100%;height:12rem;font-size:5rem;margin:0;border-radius:6rem}
.savebar .pbtn.sm{width:36rem;flex:none}
.cancel{margin:4rem auto 0;color:#fff;font:700 3.8rem/1 'Quicksand',sans-serif;text-decoration:underline;opacity:.9;padding:2rem 4rem}

.modal{position:fixed;inset:0;background:rgba(40,0,70,.6);display:grid;place-items:center;z-index:80;padding:5rem}
.modal .card{margin:0;padding:5rem 4.4rem;width:100%;text-align:center}
.modal h3{font:700 5rem/1.1 'Quicksand',sans-serif;color:var(--purple);text-transform:uppercase}
.modal p{font:500 3.6rem/1.35 'Roboto',sans-serif;margin:3rem 0 4rem;color:#333}
.modal .fab{align-self:center;margin:2rem auto 0;width:100%}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 6rem);transform:translateX(-50%);background:#2b0b45;color:#fff;border-radius:3rem;padding:2.4rem 4rem;font:500 3.4rem/1.2 'Roboto',sans-serif;z-index:90;max-width:80rem;text-align:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.98)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-1.6rem)}40%{transform:translateX(1.6rem)}60%{transform:translateX(-1rem)}80%{transform:translateX(1rem)}}
.ans.on{animation:pop .22s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
